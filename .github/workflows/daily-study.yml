name: Daily Study

# 13:00 UTC every day = 8:00am CDT (one hour after the drill).
# Manual dispatch also enabled with optional concept override.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      concept:
        description: 'Force a specific concept slug (optional). Leave blank to pick the next due one.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run study
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CONCEPT: ${{ github.event.inputs.concept }}
        run: npm run study

      - name: Commit + push study-ledger update
        run: |
          if [ -n "$(git status --porcelain curriculum/study-ledger.json)" ]; then
            git config user.name "drill-agent"
            git config user.email "drill-agent@stoneytech.net"
            git add curriculum/study-ledger.json
            git commit -m "study: $(date -u +%Y-%m-%d) — open attempt logged"
            git push
          else
            echo "No new attempt (curriculum exhausted, or DRY_RUN). Nothing to commit."
          fi
